# dsh bundle patch: inserts this plugin into a profile's layer stack.
#
# Two rows, and the split is load-bearing. The Remote service must be its own
# TOP-LEVEL insert: the api-gateway discovers Remote routes from the root service
# table, so nesting it inside the plugin row makes it invisible and the settings
# UI mounts empty.
#
# No loader config: the plugin reads its own settings through the settings
# service, so a deployment changes behavior without editing this file.
- insert:
    - id: cognitive-kernel-remote
      name: 'dsh-cognitive-kernel/remote'
    - id: cognitive-kernel
      name: 'dsh-cognitive-kernel'
